<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №1: JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Система управління університетом</h1>
        
        <!-- Меню табів -->
        <div class="tabs">
            <button class="tab-btn active" data-target="teachers">Викладачі</button>
            <button class="tab-btn" data-target="students">Студенти</button>
            <button class="tab-btn" data-target="disciplines">Дисципліни</button>
        </div>

        <!-- Контейнери з таблицями -->
        <div class="tab-content">
            <!-- Таблиця 1: Викладачі -->
            <div id="teachers" class="tab-pane active">
                <h2>Список викладачів</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ПІБ</th>
                            <th>Кафедра</th>
                            <th>Посада</th>
                            <th>Дисципліни</th>
                            <th>Стаж (р.)</th>
                            <th>Науковий ступінь</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <tbody id="teachers-tbody">
                        <!-- Дані заповнюються через JS -->
                    </tbody>
                </table>
            </div>

            <!-- Таблиця 2: Студенти -->
            <div id="students" class="tab-pane">
                <h2>Список студентів</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ПІБ</th>
                            <th>Група</th>
                            <th>Спеціальність</th>
                            <th>Курс</th>
                            <th>Середній бал</th>
                            <th>Форма навчання</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <tbody id="students-tbody">
                        <!-- Дані заповнюються через JS -->
                    </tbody>
                </table>
            </div>

            <!-- Таблиця 3: Дисципліни -->
            <div id="disciplines" class="tab-pane">
                <h2>Список дисциплін</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Назва дисципліни</th>
                            <th>Кредити ECTS</th>
                            <th>Семестр</th>
                            <th>Кафедра</th>
                            <th>Лектор</th>
                            <th>Годин</th>
                            <th>Форма контролю</th>
                        </tr>
                    </thead>
                    <tbody id="disciplines-tbody">
                        <!-- Дані заповнюються через JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
